name: Java CI

on:
  push:
    branches: [ "develop", "release", "production" ]
  pull_request:
    branches: [ "develop", "release", "production" ]

jobs:
  build-and-test:
    name: Verify Compilations and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Apache Ant and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ant ant-optional xvfb

      - name: Compile and Run Tests
        run: xvfb-run ant clean compile test

